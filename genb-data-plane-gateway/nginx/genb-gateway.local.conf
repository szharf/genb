# Local Gate C proxy. Production must replace loopback listeners and enable TLS.
worker_processes 1;
error_log logs/genb-gateway-error.log notice;
pid logs/genb-gateway.pid;

events {
    worker_connections 128;
}

http {
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 18081;
    server_name gateway.local;

    # Browser-facing auth endpoints are handled by the gateway application.
    location ^~ /agents/_auth/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header X-GenB-Upstream;
        proxy_hide_header X-GenB-Identity-Token;
    }

    location = /.well-known/genb-gateway-jwks.json {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header X-Forwarded-For "";
    }

    # The gateway returns only a route selected from its PUBLISHED allowlist.
    location = /_genb_agent_authorize {
        internal;
        proxy_pass http://127.0.0.1:18080/internal/agent-access/authorize?agentId=$agent_id&requestPath=$agent_path;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-GenB-Nginx-Identity nginx-only;
        proxy_set_header X-GenB-User-Id "";
        proxy_set_header X-GenB-Tenant-Id "";
        proxy_set_header X-GenB-Identity-Token "";
        proxy_set_header X-Forwarded-For "";
    }

    location ~ "^/agents/(?<agent_id>[A-Za-z0-9][A-Za-z0-9._-]{0,127})(?<agent_path>/.*)?$" {
        auth_request /_genb_agent_authorize;
        auth_request_set $agent_upstream $upstream_http_x_genb_upstream;
        auth_request_set $agent_tenant_id $upstream_http_x_genb_tenant_id;
        auth_request_set $agent_user_id $upstream_http_x_genb_user_id;
        auth_request_set $agent_session_id $upstream_http_x_genb_session_id;
        auth_request_set $agent_identity_token $upstream_http_x_genb_identity_token;

        proxy_pass $agent_upstream$agent_path$is_args$args;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass_request_headers off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # Every browser-supplied identity/forwarding value is replaced, never appended.
        proxy_set_header Host $proxy_host;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $http_content_length;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Origin $http_origin;
        proxy_set_header Referer $http_referer;
        proxy_set_header X-GenB-Tenant-Id $agent_tenant_id;
        proxy_set_header X-GenB-User-Id $agent_user_id;
        proxy_set_header X-GenB-Agent-Id $agent_id;
        proxy_set_header X-GenB-Session-Id $agent_session_id;
        proxy_set_header X-GenB-Identity-Token $agent_identity_token;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;

        proxy_hide_header X-GenB-Upstream;
        proxy_hide_header X-GenB-Identity-Token;
        proxy_hide_header X-GenB-Nginx-Identity;
    }
}
}
