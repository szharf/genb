groups:
  - name: genb-core-components-phase1
    rules:
      - alert: RuntimeInferenceHighErrorRate
        expr: sum(rate(runtime_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(runtime_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: page
          service: runtime-system
        annotations:
          summary: Runtime Inference 5xx rate exceeds 5 percent
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#runtime-inference-高错误率
      - alert: RuntimeInferenceP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(runtime_http_duration_seconds_bucket[5m]))) > 10
        for: 10m
        labels:
          severity: ticket
          service: runtime-system
        annotations:
          summary: Runtime Inference p95 latency exceeds 10 seconds
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#runtime-inference-高延迟
      - alert: RuntimeCapacityRejected
        expr: sum(increase(runtime_protection_rejections_total{reason="concurrency"}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
          service: runtime-system
        annotations:
          summary: Runtime concurrency protection is rejecting requests
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#容量或限流拒绝
      - alert: ControlSystemHighErrorRate
        expr: sum(rate(control_system_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(control_system_http_requests_total[5m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: page
          service: control-system
        annotations:
          summary: Control System 5xx rate exceeds 2 percent
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#control-system-高错误率
      - alert: ControlSystemP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(control_system_http_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: ticket
          service: control-system
        annotations:
          summary: Control System p95 latency exceeds 2 seconds
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#control-system-高延迟
      - alert: LongTermExtractionBacklog
        expr: max(long_term_extraction_queue_depth) > 100
        for: 15m
        labels:
          severity: ticket
          service: control-system
        annotations:
          summary: Long-term Memory extraction backlog exceeds 100 jobs
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#长期记忆任务积压
      - alert: ComponentProtectionRejected
        expr: sum(increase(control_protection_rejections_total[5m])) > 20
        for: 5m
        labels:
          severity: ticket
          service: control-system
        annotations:
          summary: Control request protection rejects more than 20 requests
          runbook: docs/operation/CORE_COMPONENT_PHASE1_RUNBOOK.md#容量或限流拒绝

