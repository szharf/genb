[project]
name = "genb-control-system-service"
version = "0.1.0"
description = "Control System service for GenB core memory components"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<44",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "redis>=5.1,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
