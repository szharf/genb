<text x="644" y="498" font-size="21" fill="#2563eb" font-weight="400">管理操作 / 权限检查</text>
<path d="M970 676 L1016 676 L1016 479 L1260 479 L1260 440" fill="none" stroke="#b65a12" stroke-width="3" marker-end="url(#orange)"/>
<text x="1050" y="522" font-size="21" fill="#b65a12" font-weight="400">部署文件与操作</text>
<text x="60" y="861" font-size="19" fill="#556980" font-weight="400">蓝色：平台与访问    绿色：智能体运行    橙色：部署管理 / 待核验事项</text>
</g></svg>