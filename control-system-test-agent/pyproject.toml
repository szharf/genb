[project]
name = "genb-control-system-test-agent"
version = "0.1.0"
description = "Thin multi-instance test agent for GenB Control System components"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
control-system-test-agent = "control_system_test_agent.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
