<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>核心组件智能体 · Alaya.To</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%2301afef%22/><text x=%2232%22 y=%2243%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22white%22>A</text></svg>" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>
  <main class="app-shell">
    <aside class="rail">
      <div class="brand"><span class="brand-mark">A</span><div><strong>Alaya.To</strong><small>CORE LAB</small></div></div>
      <div class="agent-seal"><span class="pulse"></span><strong>核心组件智能体</strong><small>已连接 GenB 能力网络</small></div>
      <nav class="capabilities" aria-label="当前能力">
        <span><i>01</i>短期记忆</span>
        <span><i>02</i>规划与推理</span>
        <span><i>03</i>模型推理</span>
      </nav>
      <button id="newTask" class="new-task" type="button">开始新任务</button>
    </aside>

    <section class="workspace">
      <header class="topbar">
        <div><span class="kicker">CONTROL SYSTEM / LIVE AGENT</span><h1>把目标说清楚，剩下的交给我。</h1></div>
        <div class="status"><span></span>服务在线</div>
      </header>

      <section id="conversation" class="conversation" aria-live="polite">
        <article class="message assistant-message intro-message">
          <div class="avatar">AI</div>
          <div class="bubble">
            <p>你好，我可以记住当前任务上下文，也可以通过对话帮你澄清需求并生成 Skill。</p>
            <div class="suggestions">
              <button type="button" data-prompt="我正在为A公司办理授信，请记住我偏好低风险方案。">测试短期记忆</button>
              <button type="button" data-prompt="帮我设计一个银行对公授信材料检查Skill。">生成一个 Skill</button>
            </div>
          </div>
        </article>
      </section>

      <section class="composer-wrap">
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="1" maxlength="16000" placeholder="描述你的目标，或继续刚才的任务……" required></textarea>
          <button id="sendButton" type="submit" aria-label="发送消息">发送</button>
        </form>
        <p class="notice">回答由已绑定的核心组件生成。重要业务决策仍需人工复核。</p>
      </section>
    </section>
  </main>
  <script src="./assets/app.js" defer></script>
</body>
</html>
