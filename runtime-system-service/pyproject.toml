[project]
name = "genb-runtime-system-service"
version = "0.1.0"
description = "Runtime System service for GenB core components"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.4,<0.136",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
