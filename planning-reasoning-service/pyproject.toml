[project]
name = "genb-planning-reasoning-service"
version = "0.1.0"
description = "Skill planning and reasoning component for GenB Control System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "cryptography>=43,<49",
  "psycopg2-binary>=2.9,<3"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
