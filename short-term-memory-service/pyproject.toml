[project]
name = "genb-short-term-memory-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135.4,<0.136",
  "pydantic>=2.12,<3",
  "uvicorn>=0.30,<1",
  "redis>=5,<6"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
